name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Unit tests
        run: pytest --junitxml=reports/junit.xml

      - name: Train model (downloads data, logs to MLflow)
        run: python -m src.train

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: |
            models/
            reports/
            data/heart_clean.csv
          if-no-files-found: warn

  docker:
    needs: build-test-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train model for the image
        run: python -m src.train
      - name: Build Docker image
        run: docker build -t heart-api:ci .
      - name: Smoke test container
        run: |
          docker run -d --name heart -p 8000:8000 heart-api:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}'
          docker logs heart
